name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transport-isolation:
    # Acceptance criterion #2 for issue #3: the raw zenoh-c API must stay
    # confined to src/transport/. Fail if any source file outside that
    # directory includes a zenoh header.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify zenoh headers are confined to src/transport/
        # Acceptance criterion #2 for issue #3: library code (include/ and
        # src/) must not depend on raw zenoh headers except in src/transport/.
        # Tests may use raw zenoh directly for build-integration smoke checks.
        run: |
          set -e
          matches=$(grep -rnE '^[[:space:]]*#include.*zenoh' \
                    --include='*.cpp' --include='*.hpp' --include='*.h' --include='*.cc' \
                    include src | grep -v '^src/transport/' || true)
          if [ -n "$matches" ]; then
            echo "::error::Raw zenoh includes found in library code outside src/transport/:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no zenoh includes in library code outside src/transport/"

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Configure
        run: cmake --preset dev-linux

      - name: Build
        run: cmake --build --preset dev-linux

      - name: Test
        run: ctest --preset dev-linux

      - name: Fixture validator (Python/struct independent check)
        run: python tests/fixtures/validate_fixtures.py

  python-param-store-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev python3-dev python3-pip
          python3 -m pip install --break-system-packages nanobind==2.9.2 numpy==2.4.2 pytest==8.3.3

      - name: Configure and build Python binding and fixture
        run: |
          nanobind_dir="$(python3 -c 'import nanobind; print(nanobind.cmake_dir())')"
          cmake -S . -B build/python -G Ninja \
            -DCMAKE_PREFIX_PATH="$nanobind_dir" \
            -DSITOS_BUILD_PYTHON=ON -DSITOS_BUILD_TESTS=ON -DSITOS_WITH_ZENOH=ON \
            -DSITOS_PYTHON_TEST_SUPPORT=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/python --parallel 2

      - name: Run Python client tests
        run: |
          extension="$(find build/python -maxdepth 1 -name '_sitos*.so' -print -quit)"
          test -n "$extension"
          cp "$extension" python/sitos/
          export LD_LIBRARY_PATH="$PWD/build/python/_deps/zenohc-src/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="$PWD/python"
          export SITOS_PYTHON_CACHE_FIXTURE="$PWD/build/python/tests/sitos_python_param_cache_fixture"
          export SITOS_PYTHON_FIXTURE="$PWD/build/python/tests/sitos_python_param_store_fixture"
          export SITOS_PYTHON_NODE_LIVE=1
          export SITOS_PYTHON_TEST_SUPPORT=1
          python3 -m pytest \
            tests/python/test_param_value.py \
            tests/python/test_numpy_zero_copy.py \
            tests/python/test_param_store.py \
            tests/python/test_param_cache.py \
            tests/python/test_param_cache_live.py -q
          python3 -m pytest \
            tests/python/test_storage_node.py tests/python/test_storage_node_gil.py -q
          python3 -m pytest tests/python/test_storage_node_live.py -q
          rm -f python/sitos/_sitos*.so

  lifecycle-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsan
            option: SITOS_ENABLE_TSAN=ON
          - name: asan-ubsan
            option: SITOS_ENABLE_ASAN_UBSAN=ON
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build/sanitizer-${{ matrix.name }} -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DSITOS_BUILD_TESTS=ON
          -DSITOS_WITH_ZENOH=OFF -D${{ matrix.option }}

      - name: Build
        run: cmake --build build/sanitizer-${{ matrix.name }} --parallel 2

      - name: Stress subscription lifecycle under TSan
        if: matrix.name == 'tsan'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build/sanitizer-tsan --output-on-failure --timeout 60 \
            --repeat until-fail:100 \
            -R 'ParamStoreSubscribeTest.(CloseWaitsForBlockedCallback|DeclarationFailureWaitsForAdmittedCallbackCopy)'
          ctest --test-dir build/sanitizer-tsan --output-on-failure --timeout 60 \
            --repeat until-fail:10 \
            -R 'StorageNodeLifecycleTest|StorageNodeSessionTest|StorageNodeBatchTest|TransportGetCompletionTest|ParamStoreSubscribeTest|ParamCacheTest|ParamCacheReadTest|SessionViewTest|SessionViewFixture'

      - name: Run lifecycle tests
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          ctest --test-dir build/sanitizer-${{ matrix.name }}
          --output-on-failure --timeout 60 -R 'StorageNodeLifecycleTest|StorageNodeSessionTest|StorageNodeBatchTest|TransportGetCompletionTest|ParamStoreSubscribeTest|ParamCacheTest|ParamCacheReadTest|SessionViewTest|SessionViewFixture'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure, build and test (MSVC + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && cmake --preset dev-windows && cmake --build --preset dev-windows && ctest --preset dev-windows"

      - name: Fixture validator (Python/struct independent check)
        run: python tests/fixtures/validate_fixtures.py

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Validate installed consumers and relocation
        run: >-
          cmake
          -DSITOS_SOURCE_DIR="$GITHUB_WORKSPACE"
          -DWORK_DIR="$GITHUB_WORKSPACE/build/package-validation"
          -DCMAKE_GENERATOR=Ninja
          -P tests/package/validate_installed_package.cmake

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate installed consumers and relocation (MSVC + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $command = "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && cmake -DSITOS_SOURCE_DIR=`"$workspace`" -DWORK_DIR=`"$workspace/build/package-validation`" -DCMAKE_GENERATOR=Ninja -P `"$workspace/tests/package/validate_installed_package.cmake`""
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  vcpkg-linux:
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: clear
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Linux provisioning prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Checkout and bootstrap pinned vcpkg
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          printf '%s\n' "$baseline" | grep -Eq '^[0-9a-f]{40}$'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach "$baseline"
          test "$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)" = "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Validate pinned RocksDB provisioning and isolated no-feature build
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'VCPKG_PROVISIONING_WALL_SECONDS=%e' cmake \
            -DSITOS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DVCPKG_ROOT="$RUNNER_TEMP/vcpkg" \
            -DWORK_DIR="$GITHUB_WORKSPACE/build/vcpkg-linux" \
            -DTRIPLET=x64-linux -DCMAKE_GENERATOR=Ninja \
            -P tests/vcpkg/validate_vcpkg_provisioning.cmake

      - name: Guard package discovery against hidden provisioning
        shell: bash
        run: |
          set -euo pipefail
          config=cmake/sitosConfig.cmake.in
          test -f CMakeLists.txt
          test -f "$config"
          if grep -nE '(vcpkg|apt-get|brew|bootstrap|git clone|FetchContent)' "$config"; then
            echo 'ERROR: installed package configuration contains a provisioning path' >&2
            exit 1
          fi
          # tests/vcpkg intentionally owns explicit package-manager provisioning validation and is
          # outside the root project and installed package-configuration boundary checked here.
          project_matches=$(
            grep -nE '(vcpkg|apt-get|brew|bootstrap|git clone)' CMakeLists.txt || true
            grep -rnE '(vcpkg|apt-get|brew|bootstrap|git clone)' \
              --include='*.cmake' --include='*.cmake.in' cmake || true
          )
          if [[ -n "$project_matches" ]]; then
            echo 'ERROR: project CMake contains a package-manager provisioning path:' >&2
            echo "$project_matches" >&2
            exit 1
          fi
          echo 'OK: root project and installed package configuration contain no hidden provisioning path'

  vcpkg-windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout and bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'invalid builtin-baseline' }
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --detach $baseline
          if ((git -C "$env:RUNNER_TEMP\vcpkg" rev-parse HEAD) -ne $baseline) { throw 'pin mismatch' }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Validate pinned RocksDB provisioning and isolated no-feature build (MSVC + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $vcpkg = "$env:RUNNER_TEMP/vcpkg"
          $command = "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && cmake -DSITOS_SOURCE_DIR=`"$workspace`" -DVCPKG_ROOT=`"$vcpkg`" -DWORK_DIR=`"$workspace/build/vcpkg-windows`" -DTRIPLET=x64-windows -DCMAKE_GENERATOR=Ninja -P `"$workspace/tests/vcpkg/validate_vcpkg_provisioning.cmake`""
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmd /c $command
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Write-Host ("VCPKG_PROVISIONING_WALL_SECONDS={0:N3}" -f $timer.Elapsed.TotalSeconds)
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Guard package discovery against hidden provisioning
        shell: pwsh
        run: |
          $config = 'cmake/sitosConfig.cmake.in'
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "Installed package configuration is missing: $config"
          }
          if (Select-String -LiteralPath $config -Pattern 'vcpkg|apt-get|brew|bootstrap|git clone|FetchContent') {
            throw 'Installed package configuration contains a provisioning path'
          }
          # tests/vcpkg intentionally owns explicit package-manager provisioning validation and is
          # outside the root project and installed package-configuration boundary checked here.
          $projectFiles = @((Resolve-Path -LiteralPath CMakeLists.txt).Path)
          $projectFiles += @(Get-ChildItem -LiteralPath cmake -Recurse -File |
            Where-Object { $_.Name -match '\.cmake(\.in)?$' } |
            ForEach-Object { $_.FullName })
          if (Select-String -LiteralPath $projectFiles -Pattern 'vcpkg|apt-get|brew|bootstrap|git clone') {
            throw 'Project CMake contains a package-manager provisioning path'
          }
          Write-Host 'OK: root project and installed package configuration contain no hidden provisioning path'
