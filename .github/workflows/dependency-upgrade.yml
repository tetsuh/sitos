# Dependency Upgrade CI — Acceptance criterion #3 for issue #3.
#
# Runs the build and tests against both the minimum supported zenoh-c version
# and the latest stable release, on manual dispatch and nightly. See
# docs/09_dependency_policy.md §4.2 for the policy.
#
# If the latest stable fails, do NOT break main (the locked default in
# cmake/zenohc.cmake stays put). Open an issue labeled
# `dependency: zenoh-upgrade` to track the fix, which should be limited to
# src/transport/zenoh_transport.cpp and build/CI configuration.

name: Dependency Upgrade

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      zenoh_version:
        description: 'zenoh-c version to test as "latest stable" (default: resolve from GitHub releases)'
        required: false

# Least-privilege token: this workflow only reads the repo to build and test.
# Declared per job (S8264) rather than at workflow level.

jobs:
  resolve-versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      minimum: ${{ steps.minimum.outputs.version }}
      latest: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve minimum supported zenoh-c version
        id: minimum
        run: |
          version=$(sed -nE 's/^set\(ZENOHC_VERSION "([^"]+)".*/\1/p' cmake/zenohc.cmake)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve latest supported stable 1.x zenoh-c version
        id: latest
        env:
          ZENOH_VERSION_INPUT: ${{ github.event.inputs.zenoh_version }}
        run: |
          set -euo pipefail
          locked=$(sed -nE 's/^eclipse-zenoh==([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            tests/interop/requirements-latest.in)
          test -n "$locked"
          if [ -n "$ZENOH_VERSION_INPUT" ]; then
            version="$ZENOH_VERSION_INPUT"
          else
            version="$(
              git ls-remote --refs --tags https://github.com/eclipse-zenoh/zenoh-c.git 'refs/tags/1.*' |
                awk '{sub("^refs/tags/", "", $2); print $2}' |
                grep -E '^1\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1
            )"
          fi
          printf '%s\n' "$version" | grep -Eq '^1\.[0-9]+\.[0-9]+$'
          test "$version" = "$locked"
          echo "Resolved latest supported stable zenoh-c: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: resolve-versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum-supported
            version: ${{ needs.resolve-versions.outputs.minimum }}
          - label: latest-stable
            version: ${{ needs.resolve-versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev python3-pip
          lock=tests/interop/requirements.txt
          if [ "${{ matrix.label }}" = latest-stable ]; then
            lock=tests/interop/requirements-latest.txt
          fi
          python3 -m pip install --break-system-packages --only-binary=:all: \
            --require-hashes -r "$lock"

      - name: Configure (zenoh-c ${{ matrix.label }} = ${{ matrix.version }})
        env:
          ZENOHC_VERSION: ${{ matrix.version }}
        run: cmake --preset dev-linux -DZENOHC_VERSION="$ZENOHC_VERSION"

      - name: Build
        run: cmake --build --preset dev-linux

      - name: Verify and run Fence qualification
        env:
          SITOS_EXPECTED_ZENOH_PYTHON_VERSION: ${{ matrix.version }}
        run: |
          python3 tests/verify_fence_test_registration.py --build build/dev-linux --profile zenoh-on
          ctest --test-dir build/dev-linux --output-on-failure --timeout 120 \
            -R '^Fence(ZenohIntegration|RawZenohInterop)Test\.'

      - name: Test
        env:
          SITOS_EXPECTED_ZENOH_PYTHON_VERSION: ${{ matrix.version }}
        run: ctest --preset dev-linux

      - name: Fixture validator
        run: python3 tests/fixtures/validate_fixtures.py

  test-windows:
    needs: resolve-versions
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum-supported
            version: ${{ needs.resolve-versions.outputs.minimum }}
          - label: latest-stable
            version: ${{ needs.resolve-versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install raw Zenoh interoperability dependencies
        shell: pwsh
        run: |
          $lock = "tests/interop/requirements.txt"
          if ("${{ matrix.label }}" -eq "latest-stable") {
            $lock = "tests/interop/requirements-latest.txt"
          }
          python -m pip install --only-binary=:all: --require-hashes -r $lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Configure, build and qualify Fence (MSVC + Ninja)
        shell: pwsh
        env:
          ZENOHC_VERSION: ${{ matrix.version }}
        run: |
          $python = (Get-Command python).Source
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          $commands = @(
            "call `"$vcvars`""
            "cmake -S . -B build/fence-dependency -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSITOS_BUILD_TESTS=ON -DSITOS_WITH_ZENOH=ON -DZENOHC_VERSION=$env:ZENOHC_VERSION -DPython3_EXECUTABLE=`"$python`""
            "cmake --build build/fence-dependency --parallel 2"
            "set SITOS_EXPECTED_ZENOH_PYTHON_VERSION=$env:ZENOHC_VERSION"
            "python tests/verify_fence_test_registration.py --build build/fence-dependency --profile zenoh-on"
            "ctest --test-dir build/fence-dependency --output-on-failure --timeout 120 -R `"^Fence(ZenohIntegration|RawZenohInterop)Test\.`""
            "python tests/fixtures/validate_fixtures.py"
          ) -join " && "
          cmd /c $commands
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
