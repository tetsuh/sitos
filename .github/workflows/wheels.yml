name: Python wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      latest_compatible:
        description: Run the non-publishing latest-compatible toolchain lane.
        required: false
        default: false
        type: boolean
      publish_target:
        description: Optionally publish the validated Linux wheel to TestPyPI.
        required: false
        default: none
        type: choice
        options:
          - none
          - testpypi
  schedule:
    - cron: "17 3 * * 1"

jobs:
  linux:
    name: Linux CPython 3.12 wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CIBW_BUILD: cp312-manylinux_x86_64
      CIBW_ARCHS_LINUX: x86_64
      # GCC 14 image pinned by immutable digest. This retains the manylinux_2_28 ABI policy.
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:a61875a2f84cab7df8de222ff12cabc08ff86eb4ad402ac90ba7bdaed9600cca
      CIBW_BEFORE_ALL_LINUX: >-
        bash -c 'set -eu;
        echo "=== compiler ===";
        gcc --version;
        g++ --version;
        echo "=== glibc ===";
        getconf GNU_LIBC_VERSION;
        echo "=== libstdc++ ===";
        libstdcxx="$(g++ -print-file-name=libstdc++.so.6)";
        strings "${libstdcxx}" | grep -E "^GLIBCXX_[0-9]" | sort -V | tail -n 1;
        echo "=== auditwheel (owned by the cibuildwheel manylinux image) ===";
        auditwheel --version'
        && bash /project/scripts/build_manylinux_zenohc.sh /opt/zenohc-stage
        && cp /project/.github/wheel-tools-requirements.txt /opt/zenohc-stage/
      # This is cibuildwheel's own build/repair/test-tool constraint input.
      CIBW_DEPENDENCY_VERSIONS: .github/wheel-tools-requirements.txt
      # cibuildwheel forwards these to its build-isolation and test environments.
      CIBW_ENVIRONMENT_LINUX: >-
        CMAKE_ARGS="-DSITOS_ZENOHC_ROOT=/opt/zenohc-stage"
        PIP_CONSTRAINT=/opt/zenohc-stage/wheel-tools-requirements.txt
        PIP_REQUIRE_HASHES=1
        PIP_ONLY_BINARY=:all:
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
        LD_LIBRARY_PATH=/opt/zenohc-stage/lib auditwheel repair -w {dest_dir} {wheel}
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Validate release configuration
        run: python3 -B tests/release/test_release_configuration.py -v
      - name: Install hash-locked wheel tools
        run: 'python -m pip install --only-binary=:all: --require-hashes -r .github/wheel-tools-requirements.txt'
      - name: Build and repair wheel
        run: python -m cibuildwheel --output-dir wheelhouse python
      - name: Validate contents, native dependencies, and clean installation
        run: |
          set -eu
          tests_dir="$PWD/tests/python"
          examples_driver="$PWD/tests/examples/test_python_examples.py"
          for wheel in wheelhouse/*.whl; do
            python scripts/check_wheel.py "$wheel" --platform linux
            docker run --rm -v "$PWD:/project" -w /project "$CIBW_MANYLINUX_X86_64_IMAGE" \
              auditwheel show "$wheel" | tee "${wheel}.auditwheel.txt"
            grep --fixed-strings "manylinux_2_28_x86_64" "${wheel}.auditwheel.txt"
            sha256sum "$wheel" | tee "${wheel}.sha256"
            quick_venv="$(mktemp -d)"
            python -m venv "$quick_venv"
            quick_requirements="$(mktemp)"
            awk '/^numpy==/{print; capture=1; next} capture && /^[[:space:]]+--hash=sha256:/{print; next} capture{exit}' \
              .github/wheel-tools-requirements.txt > "$quick_requirements"
            awk 'NR == 1 { if ($0 !~ /^numpy==/) exit 1; next } $0 !~ /^[[:space:]]+--hash=sha256:/ { exit 1 } END { if (NR < 2) exit 1 }' \
              "$quick_requirements"
            env -u LD_LIBRARY_PATH -u PYTHONPATH "$quick_venv/bin/python" -m pip install \
              --only-binary=:all: --require-hashes -r "$quick_requirements"
            env -u LD_LIBRARY_PATH -u PYTHONPATH "$quick_venv/bin/python" -m pip install \
              --no-deps --only-binary=:all: "$wheel"
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH "$quick_venv/bin/python" \
              "$examples_driver" quickstart)
            venv="$(mktemp -d)"
            python -m venv "$venv"
            env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" -m pip install \
              --only-binary=:all: --require-hashes -r .github/wheel-tools-requirements.txt
            # This generated local wheel has no pre-build hash. Its SHA-256 is recorded above;
            # --no-deps keeps every fetched dependency under the reviewed hash lock.
            env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" -m pip install \
              --no-deps --only-binary=:all: "$wheel"
            env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" -m pip install \
              --only-binary=:all: --require-hashes -r tests/interop/requirements.txt
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" \
              "$examples_driver" numpy-lut)
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" \
              "$examples_driver" raw-zenoh)
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" \
              "$examples_driver" failure-cleanup)
            "$venv/bin/python" "$examples_driver" wheel-boundary --wheel "$wheel"
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH "$venv/bin/python" \
              -m pytest "$tests_dir/test_import.py" "$tests_dir/test_param_value.py" \
              "$tests_dir/test_numpy_zero_copy.py" "$tests_dir/test_param_store.py" \
              "$tests_dir/test_param_cache.py" "$tests_dir/test_param_cache_live.py" -q)
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH SITOS_PYTHON_NODE_LIVE=1 "$venv/bin/python" \
              -m pytest "$tests_dir/test_storage_node.py" "$tests_dir/test_storage_node_gil.py" -q)
            (cd /tmp && env -u LD_LIBRARY_PATH -u PYTHONPATH SITOS_PYTHON_NODE_LIVE=1 "$venv/bin/python" \
              -m pytest "$tests_dir/test_storage_node_live.py" -q)
            env -u LD_LIBRARY_PATH -u PYTHONPATH -u MYPYPATH python \
              scripts/validate_mypy_consumers.py \
              --python "$venv/bin/python" --tests-dir "$tests_dir"
            docker run --rm -v "$PWD:/project:ro" -w /tmp \
              rockylinux/rockylinux@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176 \
              bash -ceu 'dnf -y install python3.12 python3.12-pip; awk "/^numpy==/{print; capture=1; next} capture && /^[[:space:]]+--hash=sha256:/{print; next} capture{exit}" /project/.github/wheel-tools-requirements.txt > /tmp/quick-requirements.txt; awk "NR == 1 { if (\$0 !~ /^numpy==/) exit 1; next } \$0 !~ /^[[:space:]]+--hash=sha256:/ { exit 1 } END { if (NR < 2) exit 1 }" /tmp/quick-requirements.txt; python3.12 -m venv /tmp/sitos-quick; /tmp/sitos-quick/bin/python -m pip install --only-binary=:all: --require-hashes -r /tmp/quick-requirements.txt; sha256sum /project/'"${wheel}"'; /tmp/sitos-quick/bin/python -m pip install --no-deps --only-binary=:all: /project/'"${wheel}"'; cd /tmp; env -u LD_LIBRARY_PATH -u PYTHONPATH /tmp/sitos-quick/bin/python /project/tests/examples/test_python_examples.py quickstart; python3.12 -m venv /tmp/sitos-wheel; /tmp/sitos-wheel/bin/python -m pip install --only-binary=:all: --require-hashes -r /project/.github/wheel-tools-requirements.txt; /tmp/sitos-wheel/bin/python -m pip install --no-deps --only-binary=:all: /project/'"${wheel}"'; /tmp/sitos-wheel/bin/python -m pip install --only-binary=:all: --require-hashes -r /project/tests/interop/requirements.txt; env -u LD_LIBRARY_PATH -u PYTHONPATH /tmp/sitos-wheel/bin/python /project/tests/examples/test_python_examples.py numpy-lut; env -u LD_LIBRARY_PATH -u PYTHONPATH /tmp/sitos-wheel/bin/python /project/tests/examples/test_python_examples.py raw-zenoh; env -u LD_LIBRARY_PATH -u PYTHONPATH /tmp/sitos-wheel/bin/python /project/tests/examples/test_python_examples.py failure-cleanup; /tmp/sitos-wheel/bin/python /project/tests/examples/test_python_examples.py wheel-boundary --wheel /project/'"${wheel}"'; env -u LD_LIBRARY_PATH -u PYTHONPATH /tmp/sitos-wheel/bin/python -m pytest /project/tests/python/test_import.py /project/tests/python/test_param_value.py /project/tests/python/test_numpy_zero_copy.py /project/tests/python/test_param_store.py /project/tests/python/test_param_cache.py /project/tests/python/test_param_cache_live.py -q; env -u LD_LIBRARY_PATH -u PYTHONPATH SITOS_PYTHON_NODE_LIVE=1 /tmp/sitos-wheel/bin/python -m pytest /project/tests/python/test_storage_node.py /project/tests/python/test_storage_node_gil.py -q; env -u LD_LIBRARY_PATH -u PYTHONPATH SITOS_PYTHON_NODE_LIVE=1 /tmp/sitos-wheel/bin/python -m pytest /project/tests/python/test_storage_node_live.py -q'
          done
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sitos-wheel-linux-cp312
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows:
    name: Windows CPython 3.12 wheel
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CIBW_BUILD: cp312-win_amd64
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_BEFORE_ALL_WINDOWS: >-
        python {project}/scripts/stage_zenohc.py C:/sitos-zenohc-stage --platform windows
        && copy {project}\\.github\\wheel-tools-requirements.txt C:\\sitos-zenohc-stage\\wheel-tools-requirements.txt
      # This is cibuildwheel's own build/repair/test-tool constraint input.
      CIBW_DEPENDENCY_VERSIONS: .github/wheel-tools-requirements.txt
      # cibuildwheel forwards these to its build-isolation and test environments.
      CIBW_ENVIRONMENT_WINDOWS: >-
        CMAKE_ARGS="-DSITOS_ZENOHC_ROOT=C:/sitos-zenohc-stage"
        PIP_CONSTRAINT=C:/sitos-zenohc-stage/wheel-tools-requirements.txt
        PIP_REQUIRE_HASHES=1
        PIP_ONLY_BINARY=:all:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        delvewheel repair --add-path C:/sitos-zenohc-stage/bin -w {dest_dir} {wheel}
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install hash-locked wheel tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & python -m pip install --only-binary=:all: --require-hashes -r .github/wheel-tools-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "wheel-tool installation failed: $LASTEXITCODE" }
      - name: Build and repair wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & python -m cibuildwheel --output-dir wheelhouse python
          if ($LASTEXITCODE -ne 0) { throw "cibuildwheel failed: $LASTEXITCODE" }
      - name: Validate contents, native dependencies, and clean installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Native {
            param([Parameter(Mandatory = $true)][string]$Command, [Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
            & $Command @Arguments
            if ($LASTEXITCODE -ne 0) { throw "native command failed ($LASTEXITCODE): $Command $Arguments" }
          }
          $vsRoots = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
            "$env:ProgramFiles\Microsoft Visual Studio"
          )
          $dumpbin = $vsRoots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem -Path $_ -Filter dumpbin.exe -Recurse
          } | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin.exe was not found" }
          $env:Path = "$($dumpbin.DirectoryName);$env:Path"
          $repoRoot = (Resolve-Path .).Path
          $tests = (Resolve-Path tests\python).Path
          $typingValidator = (Resolve-Path scripts\validate_mypy_consumers.py).Path
          Get-ChildItem wheelhouse\*.whl | ForEach-Object {
            Invoke-Native python scripts/check_wheel.py $_.FullName --platform windows
            Invoke-Native delvewheel show $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "delvewheel show failed" }
            Get-FileHash -Algorithm SHA256 $_.FullName | Format-List | Out-File "$($_.FullName).sha256"
            $quickRequirements = Join-Path $env:RUNNER_TEMP "sitos-numpy-requirements.txt"
            $wheelRequirements = Get-Content .github\wheel-tools-requirements.txt
            $numpyIndex = 0..($wheelRequirements.Count - 1) | Where-Object { $wheelRequirements[$_] -like "numpy==*" } | Select-Object -First 1
            if ($null -eq $numpyIndex) { throw "numpy requirement was not found in wheel-tools-requirements.txt" }
            $numpyRequirements = @($wheelRequirements[$numpyIndex])
            for ($index = $numpyIndex + 1; $index -lt $wheelRequirements.Count; $index++) {
              if ($wheelRequirements[$index] -notmatch '^\s+--hash=sha256:') { break }
              $numpyRequirements += $wheelRequirements[$index]
            }
            $invalidHashes = @($numpyRequirements | Select-Object -Skip 1 | Where-Object { $_ -notmatch '^\s+--hash=sha256:' })
            if ($numpyRequirements.Count -lt 2 -or $numpyRequirements[0] -notmatch '^numpy==' -or $invalidHashes.Count -ne 0) {
              throw "numpy requirement extraction did not produce a pin followed by hashes"
            }
            Set-Content -Path $quickRequirements -Value $numpyRequirements -Encoding utf8
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            $quickVenv = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            Invoke-Native python -m venv $quickVenv
            Invoke-Native "$quickVenv\Scripts\python.exe" -m pip install --only-binary=:all: --require-hashes -r $quickRequirements
            Invoke-Native "$quickVenv\Scripts\python.exe" -m pip install --no-deps --only-binary=:all: $_.FullName
            Push-Location $env:RUNNER_TEMP
            try {
              Invoke-Native "$quickVenv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" quickstart
            } finally {
              Pop-Location
            }
            $venv = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            Invoke-Native python -m venv $venv
            Invoke-Native "$venv\Scripts\python.exe" -m pip install --only-binary=:all: --require-hashes -r .github\wheel-tools-requirements.txt
            # This generated local wheel has no pre-build hash. Its SHA-256 is recorded above;
            # --no-deps keeps every fetched dependency under the reviewed hash lock.
            Invoke-Native "$venv\Scripts\python.exe" -m pip install --no-deps --only-binary=:all: $_.FullName
            Push-Location $env:RUNNER_TEMP
            try {
              Invoke-Native "$venv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" quickstart
              Invoke-Native "$venv\Scripts\python.exe" -m pip install --only-binary=:all: --require-hashes -r "$repoRoot\tests\interop\requirements.txt"
              Invoke-Native "$venv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" numpy-lut
              Invoke-Native "$venv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" raw-zenoh
              Invoke-Native "$venv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" failure-cleanup
              Invoke-Native "$venv\Scripts\python.exe" "$tests\..\examples\test_python_examples.py" wheel-boundary --wheel $_.FullName
              Invoke-Native "$venv\Scripts\python.exe" -m pytest `
                "$tests\test_import.py" `
                "$tests\test_param_value.py" `
                "$tests\test_numpy_zero_copy.py" `
                "$tests\test_param_store.py" `
                "$tests\test_param_cache.py" `
                "$tests\test_param_cache_live.py" -q
              $env:SITOS_PYTHON_NODE_LIVE = "1"
              Invoke-Native "$venv\Scripts\python.exe" -m pytest `
                "$tests\test_storage_node.py" `
                "$tests\test_storage_node_gil.py" -q
              Invoke-Native "$venv\Scripts\python.exe" -m pytest "$tests\test_storage_node_live.py" -q
              Remove-Item Env:SITOS_PYTHON_NODE_LIVE -ErrorAction SilentlyContinue
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
              Remove-Item Env:MYPYPATH -ErrorAction SilentlyContinue
              Invoke-Native python $typingValidator `
                --python "$venv\Scripts\python.exe" --tests-dir $tests
            } finally {
              Pop-Location
            }
          }
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sitos-wheel-windows-cp312
          path: wheelhouse/*.whl
          if-no-files-found: error

  latest-compatible:
    name: Latest compatible Python and Rust (non-publishing)
    # A maintainer adds the run-latest-compatible label to a PR to request this
    # expensive non-publishing check. Scheduled and default-branch dispatch runs
    # use the same path.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.latest_compatible) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'run-latest-compatible')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CIBW_BUILD: cp312-manylinux_x86_64
      CIBW_ARCHS_LINUX: x86_64
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:a61875a2f84cab7df8de222ff12cabc08ff86eb4ad402ac90ba7bdaed9600cca
      CIBW_BEFORE_ALL_LINUX: >-
        SITOS_RUST_TOOLCHAIN=stable bash /project/scripts/build_manylinux_zenohc.sh /opt/zenohc-stage
      CIBW_ENVIRONMENT_LINUX: CMAKE_ARGS="-DSITOS_ZENOHC_ROOT=/opt/zenohc-stage"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
        LD_LIBRARY_PATH=/opt/zenohc-stage/lib auditwheel repair -w {dest_dir} {wheel}
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install and report latest compatible Python wheel tooling
        run: |
          python -m pip install --upgrade --only-binary=:all: \
            build cibuildwheel scikit-build-core nanobind delvewheel
          python -m pip freeze | grep -E '^(build|cibuildwheel|delvewheel|nanobind|scikit-build-core)=='
      - name: Build with latest compatible Python tooling and Rust stable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("python/pyproject.toml")
          text = path.read_text()
          text = text.replace("scikit-build-core==0.10.7", "scikit-build-core>=0.10.7")
          text = text.replace("nanobind==2.9.2", "nanobind>=2.9.2")
          path.write_text(text)
          PY
          python -m cibuildwheel --output-dir latest-wheelhouse python
          git diff -- python/pyproject.toml
          git checkout -- python/pyproject.toml
      - name: Confirm no artifact publication
        run: test -n "$(find latest-wheelhouse -name '*.whl' -print -quit)"

  publish-testpypi:
    name: Publish Linux wheel to TestPyPI
    needs: [linux, windows]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_target == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sitos/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: sitos-wheel-linux-cp312
          path: dist
      # pypa/gh-action-pypi-publish v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish Linux wheel to PyPI
    needs: [linux, windows]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sitos/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: sitos-wheel-linux-cp312
          path: dist
      - name: Verify release tag matches wheel metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"release tag is not canonical SemVer: {tag}")
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one Linux wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_names = [
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise SystemExit("wheel does not contain exactly one METADATA file")
              metadata = wheel.read(metadata_names[0]).decode("utf-8")
          expected = tag.removeprefix("v")
          if f"Version: {expected}\n" not in metadata:
              raise SystemExit(f"wheel metadata version does not match {tag}")
          PY
      # pypa/gh-action-pypi-publish v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
